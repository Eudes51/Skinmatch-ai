<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinMatch AI - Recommandations cosmétiques</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        const state = {
            currentPage: 'home',
            user: null,
            userRole: null,
            authData: { email: '', password: '', name: '', businessName: '' },
            isSignUp: false,
            analysisMode: null,
            quizStep: 0,
            photoPreview: null,
            quizAnswers: { sexe: '', age: '', typePeau: '', carnation: '', problemes: [] },
            recommendations: null,
            cart: [],
            selectedTab: 'results',
            allProducts: [
                { id: 1, name: 'Nettoyant purifiant', brand: 'BeautyBénin', price: 8500, skinType: 'Grasse', problem: 'Acné', rating: 4.8, reviews: 42, reason: 'Élimine l\'excès de sébum' },
                { id: 2, name: 'Crème hydratante riche', brand: 'LuxeSkin', price: 15000, skinType: 'Sèche', problem: 'Sécheresse', rating: 4.9, reviews: 67, reason: 'Nutrition intensive' },
                { id: 3, name: 'Sérum anti-acné', brand: 'ClearSkin', price: 13000, skinType: 'Grasse', problem: 'Acné', rating: 4.8, reviews: 54, reason: 'Réduit acné et cicatrices' },
                { id: 4, name: 'SPF 50+ Protection', brand: 'SunGuard', price: 11500, skinType: 'Tous', problem: 'Protection', rating: 4.9, reviews: 112, reason: 'Protection UV maximale' },
            ],
            vendorProducts: [],
            quizQuestions: [
                { title: 'Quel est votre sexe ?', options: ['Femme', 'Homme', 'Autre'], key: 'sexe' },
                { title: 'Quel âge avez-vous ?', options: ['15-25', '25-35', '35-45', '45-55', '55+'], key: 'age' },
                { title: 'Quel est votre type de peau ?', options: ['Grasse', 'Sèche', 'Mixte', 'Normale', 'Sensible'], key: 'typePeau' },
                { title: 'Quelle est votre carnation ?', options: ['Très claire', 'Claire', 'Médium', 'Foncée', 'Très foncée'], key: 'carnation' },
                { title: 'Quel est votre principal problème ?', options: ['Acné', 'Rides', 'Taches', 'Peau terne', 'Boutons', 'Eczéma', 'Sensibilité', 'Aucun'], key: 'problemes', multiple: true },
            ]
        };

        function logout() {
            state.user = null;
            state.userRole = null;
            state.currentPage = 'home';
            state.cart = [];
            state.recommendations = null;
            state.photoPreview = null;
            render();
        }

        function handleAuth(e) {
            e.preventDefault();
            if (state.isSignUp) {
                if (!state.authData.name || !state.authData.email || !state.authData.password) return;
                state.user = { name: state.authData.name, email: state.authData.email };
                state.userRole = 'user';
            } else {
                if (!state.authData.email || !state.authData.password) return;
                state.user = { name: 'Utilisateur', email: state.authData.email };
                state.userRole = 'user';
            }
            state.authData = { email: '', password: '', name: '', businessName: '' };
            state.currentPage = 'mode';
            render();
        }

        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                state.photoPreview = event.target.result;
                state.currentPage = 'photo-quiz';
                state.quizStep = 0;
                render();
            };
            reader.readAsDataURL(file);
        }

        function handleQuizAnswer(answer) {
            const question = state.quizQuestions[state.quizStep];
            if (question.multiple) {
                if (state.quizAnswers[question.key].includes(answer)) {
                    state.quizAnswers[question.key] = state.quizAnswers[question.key].filter(a => a !== answer);
                } else {
                    state.quizAnswers[question.key].push(answer);
                }
            } else {
                state.quizAnswers[question.key] = answer;
                state.quizStep++;
            }
            render();
        }

        function submitQuiz() {
            const question = state.quizQuestions[state.quizStep];
            if (question.multiple && state.quizAnswers[question.key].length === 0) return;
            if (!question.multiple && !state.quizAnswers[question.key]) return;
            if (state.quizStep < state.quizQuestions.length - 1) {
                state.quizStep++;
            } else {
                const skinTypeName = state.quizAnswers.typePeau;
                const problemName = state.quizAnswers.problemes[0] || 'Aucun';
                const matched = state.allProducts.filter(p => (p.skinType === skinTypeName || p.skinType === 'Tous') && (p.problem === problemName || p.problem === 'Protection'));
                state.recommendations = { ...state.quizAnswers, matchedProducts: matched.length > 0 ? matched : state.allProducts.slice(0, 4), photoUsed: state.analysisMode === 'photo' };
                state.currentPage = 'results';
            }
            render();
        }

        function addToCart(product) {
            state.cart.push(product);
            render();
        }

        function removeFromCart(idx) {
            state.cart.splice(idx, 1);
            render();
        }

        function getCartTotal() {
            return state.cart.reduce((sum, p) => sum + p.price, 0);
        }

        function render() {
            const app = document.getElementById('app');
            if (state.currentPage === 'home' && !state.user) {
                app.innerHTML = `<div class="min-h-screen bg-gradient-to-b from-white to-gray-50"><header class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-[#D4AF37]"></div><h1 class="text-2xl font-bold">SkinMatch AI</h1></div><div class="flex gap-4"><button onclick="state.isSignUp = true; state.currentPage = 'auth'; render();" class="px-6 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">S'inscrire</button><button onclick="state.isSignUp = false; state.currentPage = 'auth'; render();" class="px-6 py-3 bg-[#D4AF37] text-white rounded-lg font-semibold">Se connecter</button></div></div></header><section class="max-w-6xl mx-auto px-6 py-20"><div class="text-center mb-20"><h2 class="text-5xl font-bold mb-6">Trouvez enfin les produits parfaits pour votre peau</h2><p class="text-xl text-gray-600 mb-10">Répondez à quelques questions ou analysez votre peau par photo.</p><button onclick="state.isSignUp = true; state.currentPage = 'auth'; render();" class="px-8 py-4 bg-[#D4AF37] text-white text-lg rounded-lg font-semibold">Commencer gratuitement</button></div><div class="grid md:grid-cols-4 gap-6"><div class="bg-white p-8 rounded-lg text-center border border-gray-100"><div class="text-4xl mb-4">❓</div><h3 class="font-bold text-lg">Questionnaire</h3><p class="text-gray-600 text-sm">5 questions</p></div><div class="bg-white p-8 rounded-lg text-center border border-gray-100"><div class="text-4xl mb-4">📷</div><h3 class="font-bold text-lg">Photo IA</h3><p class="text-gray-600 text-sm">Depuis galerie</p></div><div class="bg-white p-8 rounded-lg text-center border border-gray-100"><div class="text-4xl mb-4">📋</div><h3 class="font-bold text-lg">Routines</h3><p class="text-gray-600 text-sm">Matin/Soir</p></div><div class="bg-white p-8 rounded-lg text-center border border-gray-100"><div class="text-4xl mb-4">🛒</div><h3 class="font-bold text-lg">Shop</h3><p class="text-gray-600 text-sm">Achat direct</p></div></div></section></div>`;
            } else if (state.currentPage === 'auth') {
                app.innerHTML = `<div class="min-h-screen bg-gray-50"><header class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 py-4"><button onclick="state.currentPage = 'home'; render();" class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-[#D4AF37]"></div><h1 class="text-2xl font-bold">SkinMatch AI</h1></button></div></header><div class="max-w-md mx-auto mt-20 px-6"><div class="bg-white rounded-lg p-8"><h2 class="text-3xl font-bold mb-6 text-center">${state.isSignUp ? 'Créer un compte' : 'Se connecter'}</h2><form onsubmit="handleAuth(event)">${state.isSignUp ? `<input type="text" placeholder="Nom" onchange="state.authData.name = this.value" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-4">` : ''}<input type="email" placeholder="Email" onchange="state.authData.email = this.value" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-4"><input type="password" placeholder="Mot de passe" onchange="state.authData.password = this.value" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-4"><button class="w-full py-3 bg-[#D4AF37] text-white rounded-lg font-semibold">${state.isSignUp ? "S'inscrire" : 'Se connecter'}</button></form><button onclick="state.isSignUp = !state.isSignUp; render();" class="w-full mt-4 text-[#D4AF37]">${state.isSignUp ? 'Se connecter' : "S'inscrire"}</button></div></div></div>`;
            } else if (state.currentPage === 'mode' && state.user && !state.analysisMode) {
                app.innerHTML = `<div class="min-h-screen bg-gray-50"><header class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-[#D4AF37]"></div><h1 class="text-xl font-bold">SkinMatch AI</h1></div><button onclick="logout();" class="px-6 py-3 text-gray-700">Déconnexion</button></div></header><div class="max-w-4xl mx-auto px-6 py-20"><h2 class="text-4xl font-bold text-center mb-16">Choisissez votre méthode</h2><div class="grid md:grid-cols-2 gap-12"><div class="bg-white p-10 rounded-lg border-2 border-[#D4AF37]"><div class="text-6xl mb-6">❓</div><h3 class="text-2xl font-bold mb-4">Questionnaire</h3><p class="text-gray-600 mb-6">Répondez à 5 questions simples</p><button onclick="state.analysisMode = 'questionnaire'; state.currentPage = 'quiz'; render();" class="w-full px-6 py-3 bg-[#D4AF37] text-white rounded-lg font-semibold">Commencer</button></div><div class="bg-white p-10 rounded-lg border-2 border-[#D4AF37]"><div class="text-6xl mb-6">📷</div><h3 class="text-2xl font-bold mb-4">Photo de votre visage</h3><p class="text-gray-600 mb-6">Choisir une photo de votre galerie</p><label class="w-full px-6 py-3 bg-[#D4AF37] text-white rounded-lg font-semibold text-center cursor-pointer block"><input type="file" accept="image/*" onchange="handlePhotoUpload(event)" style="display: none;">Choisir photo</label></div></div></div></div></div>`;
            } else if (state.currentPage === 'quiz' && state.user) {
                const question = state.quizQuestions[state.quizStep];
                app.innerHTML = `<div class="min-h-screen bg-gray-50"><header class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-[#D4AF37]"></div><h1 class="text-xl font-bold">SkinMatch AI</h1></div><button onclick="logout();" class="px-6 py-3 text-gray-700">Déconnexion</button></div></header><div class="max-w-2xl mx-auto px-6 py-12"><div class="w-full bg-gray-200 rounded-full h-2 mb-8"><div class="bg-[#D4AF37] h-2 rounded-full" style="width: ${(state.quizStep + 1) / state.quizQuestions.length * 100}%"></div></div><div class="bg-white rounded-lg p-8"><h2 class="text-2xl font-bold mb-8">${question.title}</h2><div class="space-y-3 mb-8">${question.options.map(opt => `<button onclick="handleQuizAnswer('${opt}')" class="w-full p-4 border-2 rounded-lg text-left font-medium ${(question.multiple ? state.quizAnswers[question.key].includes(opt) : state.quizAnswers[question.key] === opt) ? 'border-[#D4AF37] bg-[#FFF8DC]' : 'border-gray-200'}">${opt}</button>`).join('')}</div><button onclick="submitQuiz();" class="w-full py-3 bg-[#D4AF37] text-white rounded-lg font-semibold">${state.quizStep === state.quizQuestions.length - 1 ? 'Résultats' : 'Suivant'}</button></div></div></div>`;
            } else if (state.currentPage === 'photo-quiz' && state.photoPreview) {
                const question = state.quizQuestions[state.quizStep];
                app.innerHTML = `<div class="min-h-screen bg-gray-50"><header class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-[#D4AF37]"></div><h1 class="text-xl font-bold">SkinMatch AI</h1></div><button onclick="logout();" class="px-6 py-3 text-gray-700">Déconnexion</button></div></header><div class="max-w-2xl mx-auto px-6 py-12"><div class="w-full bg-gray-200 rounded-full h-2 mb-8"><div class="bg-[#D4AF37] h-2 rounded-full" style="width: ${(state.quizStep + 1) / state.quizQuestions.length * 100}%"></div></div><div class="bg-white rounded-lg p-8 mb-6"><h3 class="font-bold mb-4 text-center">Votre photo</h3><img src="${state.photoPreview}" class="w-full rounded-lg max-h-64 object-cover"></div><div class="bg-white rounded-lg p-8"><h2 class="text-2xl font-bold mb-8">${question.title}</h2><div class="space-y-3 mb-8">${question.options.map(opt => `<button onclick="handleQuizAnswer('${opt}')" class="w-full p-4 border-2 rounded-lg text-left font-medium ${(question.multiple ? state.quizAnswers[question.key].includes(opt) : state.quizAnswers[question.key] === opt) ? 'border-[#D4AF37] bg-[#FFF8DC]' : 'border-gray-200'}">${opt}</button>`).join('')}</div><button onclick="submitQuiz();" class="w-full py-3 bg-[#D4AF37] text-white rounded-lg font-semibold">${state.quizStep === state.quizQuestions.length - 1 ? 'Voir recommandations' : 'Suivant'}</button></div></div></div>`;
            } else if (state.currentPage === 'results' && state.recommendations) {
                app.innerHTML = `<div class="min-h-screen bg-gray-50"><header class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-[#D4AF37]"></div><h1 class="text-xl font-bold">SkinMatch AI</h1></div><div class="flex gap-4"><span class="bg-[#FFF8DC] px-4 py-2 rounded">${state.cart.length}</span><button onclick="logout();" class="px-6 py-3 text-gray-700">Déconnexion</button></div></div></header><div class="bg-white border-b"><div class="max-w-6xl mx-auto px-6 flex gap-8"><button onclick="state.selectedTab = 'results'; render();" class="py-4 border-b-2 ${state.selectedTab === 'results' ? 'border-[#D4AF37]' : 'border-transparent'}">Résultats</button><button onclick="state.selectedTab = 'shop'; render();" class="py-4 border-b-2 ${state.selectedTab === 'shop' ? 'border-[#D4AF37]' : 'border-transparent'}">Shop</button></div></div><div class="max-w-6xl mx-auto px-6 py-12">${state.selectedTab === 'results' ? `<div class="bg-white rounded-lg p-8 mb-8"><h2 class="text-2xl font-bold mb-6">Votre profil</h2><p class="text-xl"><strong>Type:</strong> ${state.recommendations.typePeau}</p></div><div class="grid md:grid-cols-2 gap-6">${state.recommendations.matchedProducts.map(p => `<div class="bg-white rounded-lg p-6"><h3 class="font-bold text-lg">${p.name}</h3><p class="text-2xl font-bold text-[#D4AF37] my-3">${p.price.toLocaleString()} CFA</p><button onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="w-full py-2 bg-[#D4AF37] text-white rounded-lg">Ajouter</button></div>`).join('')}</div>` : `<h2 class="text-3xl font-bold mb-8">🛒 Boutique</h2><div class="grid md:grid-cols-3 gap-6">${state.allProducts.map(p => `<div class="bg-white rounded-lg p-6"><h3 class="font-bold text-lg">${p.name}</h3><p class="text-2xl font-bold text-[#D4AF37] my-3">${p.price.toLocaleString()} CFA</p><button onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="w-full py-2 bg-[#D4AF37] text-white rounded-lg">Ajouter</button></div>`).join('')}</div>`}</div></div>`;
            }
        }
        render();
    </script>
</body>
</html>
